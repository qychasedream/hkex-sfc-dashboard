name: Regulatory Data Update (Free Tier)

on:
  # 自动定时更新已停用（2026-08-28 起改为本地手动刷新：双击 刷新数据.bat）
  # 如需恢复，取消下面两行的注释：
  # schedule:
  #   - cron: '*/15 * * * *'
  # 保留手动触发
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        run: python src/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "📊 自动更新监管数据 — $(TZ='Asia/Hong_Kong' date +'%Y-%m-%d %H:%M HKT')"
            git push
            echo "✅ Data updated and pushed"
          fi
